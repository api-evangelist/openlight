name: Openlight
description: >-
  OpenLight Photonics is a silicon photonics company that designs and manufactures
  custom Photonic Application-Specific Integrated Circuits (PASICs) using a
  heterogeneously integrated, open silicon photonics platform that builds active
  components such as lasers and modulators onto the same chip as passive waveguides.
  Operating an open foundry model out of Goleta, California, OpenLight offers three
  services: design enablement through its Process Design Kit (PDK) with component
  libraries, evaluation kits, and a PDK Sampler; in-house custom PASIC design; and
  production manufacturing. Its technology targets datacom, telecom, AI data-center
  interconnect, lidar, HPC, healthcare, quantum, and IoT sensing. Spun out of Synopsys
  as an independent, venture-backed company in 2025, OpenLight has raised roughly $84M
  (a $34M Series A in 2025 and a $50M Series A-1 in 2026) from investors including
  Mayfield. This is a hardware/semiconductor company; it publishes no public web API,
  developer portal, or OpenAPI at this time — its developer surface is the chip-design PDK.
